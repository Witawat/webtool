<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WebTool{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="stylesheet" href="/static/css/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="/">🛠️ WebTool</a>
    <div class="nav-right">
      <a class="nav-link" id="lang-switch" href="?lang={{ 'en' if lang == 'th' else 'th' }}">{{ t(lang, 'nav.lang') }}</a>
      <button class="nav-btn" id="theme-toggle" type="button" data-label-dark="{{ t(lang, 'nav.theme') }}" data-label-light="{{ t(lang, 'nav.theme_light') }}">{{ t(lang, 'nav.theme') }}</button>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <p>{{ t(lang, 'ui.footer') }}</p>
    <p class="disclaimer">{{ t(lang, 'ui.disclaimer') }}</p>
  </footer>
  <script>
    window.LANG = {{ lang | tojson }};
    window.I18N = {{ all_strings(lang) | tojson }};
  </script>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
