{% extends "tool.html" %}
{% block form_fields %}
<div class="field">
  <label for="host">{{ t(lang, 'tool.traceroute.host_label') }}</label>
  <input type="text" id="host" name="host" placeholder="google.com" required>
</div>
<div class="field">
  <label for="max_hops">{{ t(lang, 'tool.traceroute.max_hops_label') }}</label>
  <input type="number" id="max_hops" name="max_hops" min="3" max="30" value="{{ default_hops }}" required>
</div>
{% endblock %}
{% block about %}
<p>{{ t(lang, 'tool.traceroute.about') }}</p>
{% endblock %}
